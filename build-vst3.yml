name: Build JCM2203 Modded Preamp VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: JCM2203ModdedPreamp-Windows-VST3
          - os: macos-latest
            artifact: JCM2203ModdedPreamp-macOS-VST3
          - os: ubuntu-latest
            artifact: JCM2203ModdedPreamp-Linux-VST3

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev pkg-config

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target JCM2203ModdedPreamp_VST3 -j 4

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/JCM2203ModdedPreamp_artefacts/**/VST3/**
